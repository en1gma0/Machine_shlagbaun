{% extends "base.html" %}
{% block body %}
<div class="page-head"><h1>Мой пароль</h1></div>
<div class="card" style="max-width:420px">
  <p class="muted" style="margin-top:0">{{ request.state.user.full_name or request.state.user.username }} · {{ ROLES[request.state.user.role] }}</p>
  {% if error %}<div class="error" style="margin-bottom:12px">{{ error }}</div>{% endif %}
  <form method="post" action="/account" class="row" style="flex-direction:column;align-items:stretch">
    <label>Текущий пароль<input type="password" name="old" required autocomplete="current-password"></label>
    <label>Новый пароль (не короче 6 символов)<input type="password" name="new" required autocomplete="new-password"></label>
    <label>Новый пароль ещё раз<input type="password" name="new2" required autocomplete="new-password"></label>
    <button>Сменить пароль</button>
  </form>
  <p class="muted small" style="margin-bottom:0">После смены пароля нужно будет войти заново.</p>
</div>
{% endblock %}
