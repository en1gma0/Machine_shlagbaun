<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ TITLES.get(page, "") }}{% endblock %} · {{ SITE_NAME }}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
<link rel="stylesheet" href="/static/app.css?v=4">
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand" href="/">🚧 {{ SITE_NAME }}</a>
    <nav class="menu">
      <a href="/" class="{{ 'on' if page=='index' }}">Монитор</a>
      <a href="/journal" class="{{ 'on' if page=='journal' }}">Журнал</a>
      <a href="/reports" class="{{ 'on' if page=='reports' }}">Отчёты</a>
      <span class="sep"></span>
      <a href="/whitelist" class="{{ 'on' if page=='whitelist' }}">Белый список</a>
      <a href="/categories" class="{{ 'on' if page=='categories' }}">Категории</a>
      <a href="/settings" class="{{ 'on' if page=='settings' }}">Настройки</a>
    </nav>
    <div class="status">
      <span id="cam-status" title="Состояние камер"></span>
      <span id="clock"></span>
    </div>
  </div>
</header>
<main>
  {% set msg = request.query_params.get("msg") %}
  {% if msg and MESSAGES.get(msg) %}<div class="flash" id="flash">✓ {{ MESSAGES[msg] }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
<script>
(function () {
  const clock = document.getElementById("clock");
  const tick = () => clock.textContent = new Date().toLocaleTimeString("ru-RU");
  tick(); setInterval(tick, 1000);
  async function status() {
    try {
      const s = await (await fetch("/api/cameras")).json();
      const ST = {ok: ["on", "работает"], frozen: ["warn", "картинка зависла"], rebooting: ["warn", "перезагружается"], offline: ["off", "нет связи"]};
      document.getElementById("cam-status").innerHTML = s.map(c => { const [cls, t] = ST[c.state] || ST.offline;
        return `<span title="${t}"><i class="dot ${cls}"></i>${c.name.replace(/[<>&]/g, "")}</span>`; }).join(" &nbsp; ");
    } catch (e) {}
  }
  status(); setInterval(status, 10000);
  // убрать ?msg= из адреса, чтобы сообщение не повторялось при обновлении
  if (location.search.includes("msg=")) {
    const u = new URL(location); u.searchParams.delete("msg"); history.replaceState(null, "", u);
    setTimeout(() => { const f = document.getElementById("flash"); if (f) f.remove(); }, 4000);
  }
})();
</script>
</body>
</html>
